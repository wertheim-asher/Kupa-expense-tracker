# Keeps the free Supabase project "kupa" from pausing after 7 days without activity.
# Once a day it calls the auth API and runs one real database query (rpc/keepalive, migration 0004).
# The old blocked 401 read did not count as activity: the project was paused on 2026-10-27 anyway.
# Needs one repo secret: SUPABASE_ANON_KEY (Supabase > Project Settings > API Keys, the anon or publishable key).
# The run fails, and GitHub emails Asher, if the key is missing or Supabase does not answer.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 5 * * *' # every day at 05:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://xblsobdgqmwvnbdhowiq.supabase.co
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the SUPABASE_ANON_KEY secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          health=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -H "apikey: $KEY" "$SUPABASE_URL/auth/v1/health")
          db=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' "$SUPABASE_URL/rest/v1/rpc/keepalive")
          echo "auth health: $health, database query: $db"
          if [ "$health" != "200" ]; then
            echo "::error::Supabase did not answer (auth health $health). Check the key, or whether the project is paused."
            exit 1
          fi
          if [ "$db" != "200" ]; then
            echo "::error::Database query returned $db. A blocked read does not count as activity."
            exit 1
          fi
