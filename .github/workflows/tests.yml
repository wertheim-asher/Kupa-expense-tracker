# Runs before anything reaches the live site: every pull request gets the type check, the unit and
# flow tests, and the phone smoke test (SPEC section 14). Merge only when this is green.
name: Tests

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04 # ubuntu-latest moved to Ubuntu 26 on 2026-10-19; playwright --with-deps fails there
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
